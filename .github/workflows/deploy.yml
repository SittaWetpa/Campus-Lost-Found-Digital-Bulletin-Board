name: Deploy to Firebase

on:
  push:
    branches: [release]

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: campus-lost-found-e58a7

jobs:
  tests:
    name: Run tests before deploy
    uses: ./.github/workflows/test.yml

  deploy-rules:
    name: Deploy Firestore + Storage rules
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy rules + indexes
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

  deploy-functions:
    name: Deploy Cloud Functions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function deps
        working-directory: functions
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy functions
        run: |
          firebase deploy \
            --only functions \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

  deploy-hosting:
    name: Deploy Firebase Hosting
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy hosting
        run: |
          firebase deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

  build-android:
    name: Build Android APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build release APK (debug-signed)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-lost-found-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
