name: Tests

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop, release]
  workflow_call:

permissions:
  contents: read

jobs:
  flutter-test:
    name: Flutter unit & widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # --no-fatal-warnings keeps pre-existing warnings visible in logs but
      # only fails the job on hard errors. Tighten once the warnings are
      # cleaned up in a dedicated pass.
      - name: flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: flutter test
        run: flutter test

  functions-test:
    name: Cloud Functions tests (functions/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - run: npm test

  functions-esm-test:
    name: Cloud Functions ESM tests (test/functions/)
    runs-on: ubuntu-latest
    # KNOWN BREAKAGE: the tests use `jest.unstable_mockModule` (ESM-only) but
    # functions/index.js was converted to CommonJS `require(...)`. The mocks
    # never intercept, the real `defineSecret` runs, and the API key check
    # rejects every request with 401. Surfacing the failure here is the
    # signal to fix it; gating PRs on it would block all merges until the
    # tests are rewritten or functions/index.js is moved back to ESM.
    continue-on-error: true
    defaults:
      run:
        working-directory: test/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: test/functions/package-lock.json

      - run: npm ci

      - run: npm test

  firestore-rules-test:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: test/firestore_rules/package-lock.json

      # firebase-tools >=14 requires JDK 21+ to run the Firestore emulator.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install test deps
        working-directory: test/firestore_rules
        run: npm ci

      # Emulator reads firestore.rules from the project root via firebase.json.
      # `emulators:exec` starts the emulator, runs the command, then shuts down.
      - name: Run rules tests against emulator
        run: firebase emulators:exec --only firestore --project demo-campus-lost-found "cd test/firestore_rules && npm test"
